# Publica el sitio estático en GitHub Pages (zentrix.company).
# Basado en la plantilla oficial «Static HTML» de GitHub Pages.
name: pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; no se cancela uno en curso.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historial completo: el sitemap toma el lastmod de cada página de git log.
          fetch-depth: 0
      - name: Sitemap y llms-full.txt desde el HTML publicado
        # Se regeneran en cada despliegue para que no se desfasen (herramientas/sitemap.py y llms.py).
        run: |
          python3 herramientas/sitemap.py
          python3 herramientas/llms.py
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Todo el repositorio es el sitio (HTML, CSS, imágenes, CNAME).
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
