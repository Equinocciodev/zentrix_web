# Publica el sitio estático en GitHub Pages (zentrix.company).
# Basado en la plantilla oficial «Static HTML» de GitHub Pages.
name: pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; no se cancela uno en curso.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historial completo: el sitemap toma el lastmod de cada página de git log.
          fetch-depth: 0
      - name: Sitemap y llms-full.txt desde el HTML publicado
        # Se regeneran en cada despliegue para que no se desfasen (herramientas/sitemap.py y llms.py).
        run: |
          python3 herramientas/sitemap.py
          python3 herramientas/llms.py
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      # El buscador: marca el contenido indexable, escribe los términos del
      # autocompletado y compila el índice de Pagefind en /pagefind/.
      - name: Índice del buscador (Pagefind)
        run: |
          python3 herramientas/buscador.py
          npx -y pagefind@1.5.2 --site .
          test -f pagefind/pagefind.js
      # Sobre la copia que se publica (el repo sigue legible): minifica CSS y JS y pone en línea el
      # CSS crítico de cada página; la hoja completa carga sin bloquear (herramientas/optimizar.cjs).
      # Las dependencias van fuera del sitio para que no se publiquen.
      - name: CSS crítico y minificado
        run: |
          npm install --prefix "$RUNNER_TEMP/opt" --no-audit --no-fund beasties@0.5.5 esbuild@0.28.2
          NODE_PATH="$RUNNER_TEMP/opt/node_modules" node herramientas/optimizar.cjs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Todo el repositorio es el sitio (HTML, CSS, imágenes, CNAME).
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
